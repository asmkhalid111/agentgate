spring:
  datasource:
    url: jdbc:h2:mem:agentgate_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

agentgate:
  ratelimit:
    enabled: true
    default-agent-rpm: 60
    default-tool-rpm: 120
    default-agent-daily-quota: 10000
    default-tool-daily-quota: 50000
    default-hourly-write-cap: 20
    warning-threshold-percent: 80
