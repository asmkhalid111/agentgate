spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:agentgate_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: agentgate-web
            client-secret: test-web-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          keycloak:
            authorization-uri: http://localhost:8180/realms/agentgate/protocol/openid-connect/auth
            token-uri: http://localhost:8180/realms/agentgate/protocol/openid-connect/token
            jwk-set-uri: http://localhost:8180/realms/agentgate/protocol/openid-connect/certs
            user-name-attribute: preferred_username

management:
  health:
    redis:
      enabled: false

agentgate:
  approval:
    default-timeout-seconds: 900
    expiration-interval-ms: 60000
    expiration-initial-delay-ms: 5000
    webhook:
      enabled: false
      url: http://localhost:8082/api/webhook/approvals
      connect-timeout-ms: 3000
      read-timeout-ms: 5000
  ratelimit:
    enabled: true
    default-agent-rpm: 60
    default-tool-rpm: 120
    default-agent-daily-quota: 10000
    default-tool-daily-quota: 50000
    default-hourly-write-cap: 20
    warning-threshold-percent: 80
