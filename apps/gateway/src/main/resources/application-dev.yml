spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:agentgate_db}
    username: ${POSTGRES_USER:agentgate}
    password: ${POSTGRES_PASSWORD:agentgate_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/agentgate}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/agentgate/protocol/openid-connect/certs}

