services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.compose
      target: gateway
    container_name: agentgate-gateway
    ports:
      - "8080:8080"
    environment:
      AGENTGATE_DEMO_ORIGIN: http://demo-tools:8082
      AGENTGATE_DEMO_TOKEN: ${AGENTGATE_DEMO_TOKEN:?Set AGENTGATE_DEMO_TOKEN in .env}
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agentgate_db}
      POSTGRES_USER: ${POSTGRES_USER:-agentgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/agentgate
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/agentgate/protocol/openid-connect/certs
      KEYCLOAK_AUTH_URI: http://localhost:8180/realms/agentgate/protocol/openid-connect/auth
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/agentgate/protocol/openid-connect/token
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?Set KEYCLOAK_WEB_CLIENT_SECRET in .env}
      AGENTGATE_APPROVAL_WEBHOOK_ENABLED: ${AGENTGATE_APPROVAL_WEBHOOK_ENABLED:-true}
      AGENTGATE_APPROVAL_WEBHOOK_URL: ${AGENTGATE_APPROVAL_WEBHOOK_URL:-http://demo-tools:8082/api/webhook/approvals}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  demo-tools:
    build:
      context: .
      dockerfile: Dockerfile.compose
      target: demo-tools
    container_name: agentgate-demo-tools
    ports:
      - "8082:8082"
    environment:
      AGENTGATE_DEMO_TOKEN: ${AGENTGATE_DEMO_TOKEN:?Set AGENTGATE_DEMO_TOKEN in .env}
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    container_name: agentgate-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentgate_db}
      POSTGRES_USER: ${POSTGRES_USER:-agentgate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - agentgate-pgdata:/var/lib/postgresql/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentgate} -d ${POSTGRES_DB:-agentgate_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agentgate-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - agentgate-redisdata:/data
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: agentgate-keycloak
    ports:
      - "8180:8080"
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HOSTNAME_URL: http://localhost:8180
      KC_HTTP_RELATIVE_PATH: /
      KEYCLOAK_HUMAN_ADMIN_PASSWORD: ${KEYCLOAK_HUMAN_ADMIN_PASSWORD:?Set KEYCLOAK_HUMAN_ADMIN_PASSWORD in .env}
      KEYCLOAK_APPROVER_PASSWORD: ${KEYCLOAK_APPROVER_PASSWORD:?Set KEYCLOAK_APPROVER_PASSWORD in .env}
      KEYCLOAK_HUMAN_USER_PASSWORD: ${KEYCLOAK_HUMAN_USER_PASSWORD:?Set KEYCLOAK_HUMAN_USER_PASSWORD in .env}
      AGENT_CLIENT_SECRET: ${AGENT_CLIENT_SECRET:?Set AGENT_CLIENT_SECRET in .env}
      AGENT_SUPPORT_SECRET: ${AGENT_SUPPORT_SECRET:?Set AGENT_SUPPORT_SECRET in .env}
      AGENT_UNAUTH_SECRET: ${AGENT_UNAUTH_SECRET:?Set AGENT_UNAUTH_SECRET in .env}
      KEYCLOAK_WEB_CLIENT_SECRET: ${KEYCLOAK_WEB_CLIENT_SECRET:?Set KEYCLOAK_WEB_CLIENT_SECRET in .env}
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/agentgate/.well-known/openid-configuration HTTP/1.1\\r\\nHost: localhost:8080\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep '200 OK' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  agentgate-pgdata:
  agentgate-redisdata:

