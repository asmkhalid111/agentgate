server:
  port: 8082

spring:
  application:
    name: agentgate-demo-tools
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: agentgate-demo-tools-mcp
        version: 1.0.0
        streamable-http:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true


logging:
  structured:
    format:
      console: logstash
