server:
  port: 8080

spring:
  application:
    name: agentgate-gateway
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: agentgate-web
            client-secret: ${KEYCLOAK_WEB_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          keycloak:
            authorization-uri: ${KEYCLOAK_AUTH_URI:http://localhost:8180/realms/agentgate/protocol/openid-connect/auth}
            token-uri: ${KEYCLOAK_TOKEN_URI:http://localhost:8180/realms/agentgate/protocol/openid-connect/token}
            jwk-set-uri: ${KEYCLOAK_JWKS_URI:http://localhost:8180/realms/agentgate/protocol/openid-connect/certs}
            user-name-attribute: preferred_username
  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: agentgate-mcp-server
        version: 1.0.0
        streamable-http:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

agentgate:
  approval:
    default-timeout-seconds: 900
    expiration-interval-ms: 60000
    expiration-initial-delay-ms: 5000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [traceId=%X{traceId:-} spanId=%X{spanId:-}] - %msg%n"
  level:
    root: INFO
    com.agentgate.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.ai.mcp: DEBUG

