spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:agentgate_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false
