spring:
  datasource:
    url: jdbc:h2:mem:agentgate_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  flyway:
    enabled: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:172.28.119.242}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: false

management:
  health:
    redis:
      enabled: false

agentgate:
  ratelimit:
    enabled: true
    default-agent-rpm: 60
    default-tool-rpm: 120
    default-agent-daily-quota: 10000
    default-tool-daily-quota: 50000
    default-hourly-write-cap: 20
    warning-threshold-percent: 80
  resilience:
    default-connect-timeout: 3s
    default-read-timeout: 5s
    default-execution-deadline: 10s
    default-failure-threshold: 3
    default-open-wait-duration: 1s
    tools:
      orders_refund:
        connect-timeout: 3s
        read-timeout: 5s
        failure-threshold: 3
        open-wait-duration: 1s
      orders_get:
        connect-timeout: 3s
        read-timeout: 5s
        failure-threshold: 3
        open-wait-duration: 1s
