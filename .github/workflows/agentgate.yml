name: AgentGate verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: agentgate
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Configure disposable local fixture credentials
        run: python scripts/init_local_env.py
      - name: Start Redis for existing gateway integration tests
        run: docker compose up -d --wait redis
      - name: Run unit, MVC slice, storage, architecture and outage tests
        run: bash mvnw -B verify
      - name: Start application
        id: stack
        run: |
          python -m pip install requests
          mkdir -p target/c5
          docker compose up -d --build --wait
      - name: QA1 security acceptance
        run: |
          mkdir -p target/c5
          python scripts/verify_qa1_security.py
        env:
          QA1_RESULTS_PATH: target/c5/qa1-results.json
      - name: C3 demo API and protected downstream calls
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: python scripts/verify_demo_api.py | tee target/c5/demo-api.log
      - name: QA3 authenticated audit lookup and delegated calls
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: python scripts/verify_delegated_orders.py | tee target/c5/qa3.log
      - name: QA5 automated onboarding rehearsal
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: python scripts/verify_qa5_onboarding.py | tee target/c5/qa5-rehearsal.log
      - uses: grafana/setup-k6-action@v1
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
      - name: QA2 load acceptance
        if: ${{ !cancelled() && steps.stack.outcome == 'success' }}
        run: |
          docker compose -p agentgate-benchmark -f compose.benchmark.yaml up --build -d --wait
          python scripts/run_qa2_ci.py | tee target/c5/qa2.log
      - name: Preserve test and acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentgate-verification
          path: |
            agentgate/apps/*/target/surefire-reports/*.txt
            agentgate/apps/*/target/failsafe-reports/*.txt
            agentgate/target/c5/
